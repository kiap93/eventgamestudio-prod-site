name = "eventgamestudio"
main = "worker.ts"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/env.js"]

# Cloudflare Workers Globally Distributed Rate Limiting Bindings
# Synchronized across all global Cloudflare edge Points of Presence (PoPs)
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ORG_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "WALLET_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 15, period = 60 }

[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "SCORE_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 120, period = 60 }

