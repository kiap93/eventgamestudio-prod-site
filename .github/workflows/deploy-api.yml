name: Deploy API Worker

on:
  push:
    branches:
      - main

jobs:
  deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (Pre-deployment gate)
        run: bun run lint

      - name: Run Core Automated Test Suites
        run: |
          bun run test:wallet
          bun run test:migration
          bun run test:fail-closed-pricing
          bun run test:flow
          bun run test:cron
          bun test server/db/invoices_phase2.test.ts server/db/invoices_phase5.test.ts

      - name: Verify Production Compilation
        run: bun run build

      - name: Deploy Staging API Worker (eventgamestudio-api)
        run: bunx wrangler deploy --name eventgamestudio-api --config wrangler.api.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Production API Worker (eventgamestudio-prod-api)
        run: bunx wrangler deploy --name eventgamestudio-prod-api --config wrangler.api.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}